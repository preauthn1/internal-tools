[PHP]
; Maximum execution time
max_execution_time = 300

; Maximum input time
max_input_time = 300

; Memory limit
memory_limit = 512M

; Post max size
post_max_size = 20M

; Upload max filesize
upload_max_filesize = 20M

; Maximum number of files that can be uploaded
max_file_uploads = 20

; Default charset
default_charset = "UTF-8"

; Date timezone
date.timezone = UTC

; Error reporting (set to E_ALL & ~E_DEPRECATED & ~E_STRICT for production)
error_reporting = E_ALL 
;error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Display errors (set to Off for production)
display_errors = Off
display_startup_errors = Off

; Log errors
log_errors = On
error_log = /var/log/php_errors.log

; Session settings are managed by Laravel via config/session.php and .env
; php.ini session settings only apply when using PHP's native session functions directly
; Laravel uses its own session driver system (file, redis, database, etc.)

; OPcache settings
;opcache.enable=1
;opcache.enable_cli=0
;opcache.memory_consumption=256
;opcache.interned_strings_buffer=16
;opcache.max_accelerated_files=20000
;opcache.validate_timestamps=0
;opcache.revalidate_freq=0
;opcache.fast_shutdown=1

; Realpath cache
realpath_cache_size=4096K
realpath_cache_ttl=600


