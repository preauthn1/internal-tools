services:
  mysql:
    container_name: mysql
    image: 'mysql:8.0.44'
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    restart: always
    ports:
      - 3306:3306
    environment:
      'MYSQL_ROOT_PASSWORD': 'afbff41f9be211'
      'MYSQL_DATABASE': 'local'
      'MYSQL_USER': 'odie'
      'MYSQL_PASSWORD': '8486bfc8caad611'
    networks:
      - local

  redis:
    container_name: redis
    image: 'redis:8.4.0'
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data
    restart: always
    networks:
      - local


  api_agent:
    container_name: api_agent
    build:
      context: .
      dockerfile: ./docker/API_Agent/Dockerfile
    ports:
      - 8001:80
    volumes:
      - ./API_Agent/_release:/var/www/html
      - ./API_Agent/logs:/var/www/html/storage/logs
      - ./API_Agent/nginx_logs:/var/log/nginx
    restart: unless-stopped
    tty: true
    networks:
      - local

  web-agent:
    container_name: web-agent
    build:
      context: .
      dockerfile: ./docker/WEB_AgentBackend/Dockerfile
    volumes:
      - ./WEB_AgentBackend/_release:/var/www/html
      - ./WEB_AgentBackend/logs:/var/www/html/logs
      - ./WEB_AgentBackend/nginx_logs:/var/log/nginx
    ports:
      - 8002:80
    tty: true
    restart: unless-stopped
    networks:
      - local

  api_front:
    container_name: api_front
    build:
      context: .
      dockerfile: ./docker/API_Frontend/Dockerfile
    ports:
      - 8003:80
    volumes:
      - ./API_Frontend/_release:/var/www/html
      - ./API_Frontend/logs:/var/www/html/storage/logs
      - ./API_Frontend/nginx_logs:/var/log/nginx
    restart: unless-stopped
    tty: true
    networks:
      - local

  api-inter:
    container_name: api-inter
    build:
      context: .
      dockerfile: ./docker/api-internal/Dockerfile
    ports:
      - 8004:80
    volumes:
      - ./api-internal/_release:/var/www/html
      - ./api-internal/logs:/var/www/html/storage/logs
      - ./api-internal/nginx_logs:/var/log/nginx
    restart: unless-stopped
    tty: true
    networks:
      - local

  apis-php:
    build:
      context: .
      dockerfile: ./docker/apis/Dockerfile
    container_name: apis-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apis:/var/www/html
      - ./docker/apis/conf/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - local

  apis-nginx:
    image: nginx:alpine
    container_name: apis-nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - ./apis:/var/www/html
      - ./docker/apis/conf/nginx.default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - local
    depends_on:
      - apis-php

  api-ext:
    container_name: api-ext
    build:
      context: .
      dockerfile: ./docker/API_External/Dockerfile
    ports:
      - 8007:80
    volumes:
      - ./API_External/_release:/var/www/html
      - ./API_External/laravel_logs:/var/www/html/storage/logs
      - ./API_External/fpm_logs:/var/log/php-fpm
      - ./API_External/nginx_logs:/var/log/nginx
    restart: unless-stopped
    tty: true
    networks:
      - local

networks:
  local:
    name: local
    driver: bridge

