{{- if .Values.versions }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "game-server.fullname" . }}-versions
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
data:
  {{- range $type, $objs := .Values.versions }}
  {{- range $name, $ver := . }}
  {{ $type }}-{{ $name }}: {{ . }}
  {{- end }}
  {{- end }}
{{- end }}