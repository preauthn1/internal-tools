{{- $root := . }}
{{- $fullname := include "game-server.fullname" . }}
{{- $proxyip := "" }}
{{- if .Values.websocket }}
{{- $proxyip = .Values.websocket.proxyip }}
{{- end }}

{{- $dbver := .Values.defaultVersion | default "latest" }}
{{- $gamever := .Values.defaultVersion | default "latest" }}

{{- range $name, $game := .Values.game }}

{{- if $root.Values.versions }}
  {{- if $root.Values.versions.common }}
    {{- if $root.Values.versions.common.dbserver }}
    {{- $dbver = $root.Values.versions.common.dbserver }}
    {{- end }}
  {{- end }}
  {{- if $root.Values.versions.game }}
    {{- if index $root.Values.versions.game $name }}
    {{- $gamever = index $root.Values.versions.game $name }}
    {{- end }}
  {{- end }}
{{- end }}

{{- range $i, $room := .room }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-game-{{ $name }}-{{ $i }}
  labels:
    {{- with $root }}
    {{- include "game-server.labels" . | nindent 4 }}
    {{- end }}
data:
  {{- range $filename, $config := .configs}}
  {{ $filename }}: {{ . | quote}}
  {{- end }}
  serverinfo.dat: |
    [server]
    proxyip={{ $proxyip }}
    serveraddr=:{{ .port }}
    grpcaddr=:3100
    hallsvraddr={{ $fullname }}-hall.{{ $root.Release.Namespace }}.svc.cluster.local:10001
    dbserveraddr=:8000
    nsserveraddr={{ $fullname }}-notify.{{ $root.Release.Namespace }}.svc.cluster.local:9000

    [gameserver]
    servername={{ $game.name }}_{{ $i }}
    serverid={{ .serverid }}
    hostandbackup=0

    [defense]
    serverdesc={{ $name }}-{{ $i }}
    enable=0
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-game-{{ $name }}-{{ $i }}
  labels:
    {{- with $root }}
    {{- include "game-server.labels" . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: {{ $name }}-{{ $i }}
      protocol: TCP
      port: {{ .port }}
  selector:
    app: gameserver
    game: {{ $name }}
    room: {{ $i | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-game-{{ $name }}-{{ $i }}
  labels:
    {{- with $root }}
    {{- include "game-server.labels" . | nindent 4 }}
    {{- end }}
  annotations:
    example.invalid/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameserver
      game: {{ $name }}
      room: {{ $i | quote }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      name: {{ $fullname }}-game-{{ $name }}-{{ $i }}
      labels:
        app: gameserver
        game: {{ $name }}
        room: {{ $i | quote }}
        {{- with $root }}
        {{- include "game-server.labels" . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: game-config
          configMap:
            name: {{ $fullname }}-game-{{ $name }}-{{ $i }}
        {{- if $root.Values.db }}
        - name: db-config
          configMap:
            name: {{ $fullname }}-db
        {{- end }}
        {{- if .proto }}
        - name: protodata
          configMap:
            name: {{ $fullname }}-proto-{{ .proto }}
        {{- end }}
        - name: storage
          emptyDir: {}
        - name: tz-config
          hostPath: 
            path: /usr/share/zoneinfo/{{ $root.Values.timezone | default "UTC" }}
      containers:
        {{- if $root.Values.db }}
        - name: db
          image: example.invalid/dbserver:{{ $dbver | default "latest" }}
          imagePullPolicy: Always
          ports:
            - name: dbserver
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: db-config
              mountPath: /app/config
              readOnly: true
            - name: tz-config
              mountPath: /etc/localtime
              readOnly: true
        {{- end }}
        - name: game
          image: example.invalid/gameserver/{{ $name }}:{{ $gamever | default "latest" }}
          imagePullPolicy: Always
          env:
          - name: APP_GROUP
            value: {{ $game.group }}
          ports:
            - name: {{ $name }}-{{ $i }}
              containerPort: {{ .port }}
              protocol: TCP
          volumeMounts:
            - name: game-config
              mountPath: /app/config
              readOnly: true
            - name: tz-config
              mountPath: /etc/localtime
              readOnly: true
            {{- if .proto }}
            - name: protodata
              mountPath: /app/protodata
              readOnly: true
            {{- end }}
---
{{- end }}
{{- end }}