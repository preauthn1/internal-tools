apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-server.fullname" . }}-tfserver
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
  # annotations:
  #   metallb.universe.tf/address-pool: {{ .Release.Namespace }}
    # metallb.universe.tf/allow-shared-ip: {{ .Release.Namespace }}
spec:
  {{- if .Values.websocket }}
  type: ClusterIP
  {{- else }}
  type: LoadBalancer
  {{- end }}
  ports:
    {{- if .Values.websocket }}
    - name: websocket
      port: {{ .Values.websocket.port }}
    {{- else }}
    - name: hall
      port: 10000
    {{- range $name, $game := .Values.game }}
    {{- range $i, $room := .room }}
    - name: {{ $name }}-{{ $i }}
      port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- end }}
  selector:
    app: tfserver
---

{{ $svrver := .Values.defaultVersion | default "latest" }}

{{- if .Values.versions }}
  {{- if .Values.versions.common }}
    {{- if .Values.versions.common.tfserver }}
    {{- $svrver = .Values.versions.common.tfserver }}
    {{- end }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "game-server.fullname" . }}-tfserver
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
  annotations:
    example.invalid/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tfserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      name: {{ include "game-server.fullname" . }}-tfserver
      labels:
        app: tfserver
        {{- include "game-server.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: tfserver-config
          configMap:
            name: {{ include "game-server.fullname" . }}-tfserver
        - name: storage
          emptyDir: {}
        - name: tz-config
          hostPath: 
            path: /usr/share/zoneinfo/{{ .Values.timezone | default "UTC" }}
      containers:
        - name: tfserver
          image: example.invalid/tfserver:{{ $svrver | default "latest" $svrver }}
          imagePullPolicy: Always
          volumeMounts:
            - name: tfserver-config
              mountPath: /app/config
              readOnly: true
            - name: tz-config
              mountPath: /etc/localtime
              readOnly: true
