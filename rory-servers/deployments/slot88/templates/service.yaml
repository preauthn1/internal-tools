apiVersion: v1
kind: Service
metadata:
  name: {{ include "slot88.fullname" . }}
  # annotations: 
  #   metallb.universe.tf/address-pool: {{ .Release.Namespace }}
  #   metallb.universe.tf/allow-shared-ip: {{ .Release.Namespace }}
  labels:
    {{- include "slot88.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: forward
      protocol: TCP
      port: {{ .Values.forward.port }}
  selector:
    app: slot88
