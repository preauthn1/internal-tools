#繼承用 發送slack通知
.step-send-slack-notify-k8s:
  stage: send-slack-notify-k8s
  tags:
    - dotnet
  script:  
    - var_msg="docker建置完成 已更新至dev <$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID|pipelines/$CI_PIPELINE_ID> ($CI_COMMIT_REF_NAME) ($APP_NAME) \`${CI_COMMIT_SHA:0:8}\` " 
    - curl -H "Content-Type:application/x-www-form-urlencoded" -X POST --data "token=[REDACTED]" "$SLACK_API_URL"    
  
AdminSys Success Slack:
  needs: 
    - DEV AdminSys Deploy
    - Test Build
    - Run Test
  dependencies:
    - DEV AdminSys Deploy
    - Test Build
    - Run Test
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: AdminSysAPI  
  
Game Success Slack:
  needs: 
    - DEV Game Deploy
    - Test Build
    - Run Test    
  dependencies:
    - DEV Game Deploy
    - Test Build
    - Run Test
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: GameAPI  
  
Public Success Slack:
  needs: 
    - DEV Public Deploy
    - Test Build
    - Run Test
  dependencies:
    - DEV Public Deploy
    - Test Build
    - Run Test
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: PublicAPI
  
Vendor Success Slack:
  needs: 
    - DEV Vendor Deploy
    - Test Build
    - Run Test
  dependencies:
    - DEV Vendor Deploy
    - Test Build
    - Run Test    
  extends: .step-send-slack-notify-k8s
  variables:
    APP_NAME: VendorAPI

