variables:
  SLACK_TOKEN: [REDACTED]"
  SLACK_BOT_NAME: "gitlab_ci_機器人"  
  SLACK_CHANNEL: "backend_jenkins"  
  SLACK_CHANNEL_K8S: "backend_release_k8s"  
  SLACK_API_URL: "https://example.invalid/api/chat.postMessage"  

stages:
  - build
  - test
  - build-docker
  - deploy-to-enviroment
  - send-slack-notify-k8s
  - send-slack-notify-when-fail
  
#確定可以建置成功
Test Build:
  stage: build
  tags:
    - dotnet
  only:
    - develop
    - master
    - test_ci_script
    - issue_7755_pgs_singleWallet
    - issue_20210412_amount_convert_to_game_point
    - issue_87_funkyAPI
    - UAT
    - QA
  image: example.invalid/dotnet/core/sdk:3.1
  artifacts:
    name: release
    expire_in: 60 min
    paths:
      - release
  script:
    - date
    - dotnet restore target.API.ALL.sln
    - date
    - dotnet build target.API.ALL.sln
    - date
    - mkdir -p ${CI_PROJECT_DIR}/release
    - cd ${CI_PROJECT_DIR}/target.API.AdminSys
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.AdminSys
    - cd ${CI_PROJECT_DIR}/target.API.Game
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.Game
    - cd ${CI_PROJECT_DIR}/target.API.Public
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.Public
    - cd ${CI_PROJECT_DIR}/target.API.Vendor
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.Vendor
    - cd ${CI_PROJECT_DIR}/target.API.ExternalVendor
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.ExternalVendor
    - cd ${CI_PROJECT_DIR}/target.API.File
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.File
    - cd ${CI_PROJECT_DIR}/target.Job.Console
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.Job.Console
    - cd ${CI_PROJECT_DIR}/target.API.Job
    - dotnet publish -c Release -o ${CI_PROJECT_DIR}/release/target.API.Job

Run Test:
  stage: test
  tags:
    - dotnet
  image: example.invalid/dotnet/core/sdk:3.1
  script:
    - sed -i 's/MinProtocol = TLSv1.2/MinProtocol = TLSv1/' /etc/ssl/openssl.cnf && sed -i 's/CipherString = DEFAULT@SECLEVEL=2/CipherString = DEFAULT@SECLEVEL=1/' /etc/ssl/openssl.cnf
    - dotnet test target.Testing/target.Testing.csproj
    

# build docker 共用設定 
.build-docker:
  stage: build-docker
  dependencies:
    - Test Build
  tags:
    - dotnet
  image: docker:latest
  variables:
    DOCKER_HOST: tcp://localhost:2375
  services:
    - docker:18.09.7-dind
  only:
    - develop
    - UAT
    - issue_87_funkyAPI
    - issue_7755_pgs_singleWallet
    - issue_20210412_amount_convert_to_game_point
    - QA
    - master
  before_script:
    - docker info
    - docker login -u "admin" -p "admin123" https://example.invalid
  script:
    - IMG_NAME=$(echo "${APP_NAME}" | tr '[:upper:]' '[:lower:]')
    #- docker pull example.invalid/target/backend/${IMG_NAME}
    - echo ${CI_COMMIT_SHA:0:8}
    - echo ${DOCKER_FILE}
    - docker build -f DockerFiles/${DOCKER_FILE} --build-arg APP_NAME=${APP_NAME} --build-arg SHA1=${CI_COMMIT_SHA:0:8} --build-arg PIPE_ID=${CI_PIPELINE_ID} -t example.invalid/target/backend/${IMG_NAME} .
    - docker tag example.invalid/target/backend/${IMG_NAME} example.invalid/target/backend/${IMG_NAME}:${CI_PIPELINE_ID}
    - docker push example.invalid/target/backend/${IMG_NAME}
    - docker push example.invalid/target/backend/${IMG_NAME}:${CI_PIPELINE_ID}
  when: manual

#建置成docker_image
