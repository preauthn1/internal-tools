events {}

http {
    server {
        listen 443 ssl;
        server_name 0.0.0.0;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name 0.0.0.0;
        return 301 https://$host$request_uri;
    }
}
