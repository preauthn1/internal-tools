version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    # 同時掛載為 /workspace (前端) 與 /var/www (後端)，滿足兩位 Agent 的環境路徑需求
    volumes:
      - ..:/workspace:cached
      - ..:/var/www:cached
      - ../.private/id_rsa:/home/vscode/.ssh/id_rsa:ro
    command: sleep infinity
    # 預防 VSCode 進入 container 後發生權限問題，指定以 vscode 使用者運行
    user: vscode
    # 讓 app 容器可以使用 localhost 訪問 mysql 與 redis
    network_mode: service:mysql
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: [REDACTED]
      MYSQL_DATABASE: testing
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
